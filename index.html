<!DOCTYPE html>

<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>f</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: #1a1b1e;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

textarea {
    width: 100%;
    min-height: 90px;
    padding: 10px;
    background: #2b2d32;
    color: white;
    border: 1px solid #3d4047;
    border-radius: 6px;
    resize: vertical;
}

button {
    height: 45px;
    border: 0;
    border-radius: 6px;
    background: #8fb0ff;
    cursor: pointer;
}

.trap {
    position: absolute;
    left: -9999px;
}

.status {
    text-align: center;
    margin: 0;
}

.ok {
    color: #7fd6a0;
}

.error {
    color: #ff8f8f;
}

.textos {
    display: none;
    margin-top: 20px;
}

.text-box {
    margin-top: 15px;
    padding: 15px;
    background: #2b2d32;
    border: 1px solid #3d4047;
    border-radius: 6px;
}

.text-box p {
    margin: 0 0 10px 0;
}

.copiar {
    height: 35px;
    padding: 0 12px;
}
</style>

</head>

<body>

<p>dont share personal data HERE</p>

<main class="container">

    <form id="formulario"
          action="https://formspree.io/f/xlgwwqjw"
          method="POST">

        <textarea name="1-----------------------1" placeholder="1"></textarea>

        <textarea name="2-----------------------2" placeholder="2"></textarea>

        <textarea name="3-----------------------3" placeholder="3"></textarea>

        <div class="trap">
            <input type="text"
                   name="_gotcha"
                   tabindex="-1"
                   autocomplete="off">
        </div>

        <button type="submit" id="enviar">■</button>

        <p class="status" id="estado"></p>

    </form>

    <!-- BOTÓN PARA MOSTRAR LOS TEXTOS -->

    <button type="button" id="mostrarTextos">&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp</button>

    <!-- CONTENEDORES DE TEXTO -->

    <div class="textos" id="textos">

<!---------------------------------------------CHAT GPT--------------------------------------------------->
        <div class="text-box">
            <p id="texto1">&lt;div class="trap"&gt;
    &lt;input type="text"
           name="_gotcha"
           tabindex="-1"
           autocomplete="off"&gt;
&lt;/div&gt;
&lt;button type="submit" id="enviar"&gt;■&lt;/button&gt;
&lt;p class="status" id="estado"&gt;&lt;/p&gt;</p> <!-- A -->
            <button type="button" class="copiar" onclick="copiarTexto('texto1', this)">
                &nbsp;&nbsp; c &nbsp;&nbsp;
            </button>
        </div>

        <div class="text-box">
            <p id="texto2">783457 874358435 87893475 02138</p> <!-- B -->
            <button type="button" class="copiar" onclick="copiarTexto('texto2', this)">
                &nbsp;&nbsp; c &nbsp;&nbsp;
            </button>
        </div>

        <div class="text-box">
            <p id="texto3"></p> <!-- C -->
            <button type="button" class="copiar" onclick="copiarTexto('texto3', this)">
                &nbsp;&nbsp; c &nbsp;&nbsp;
            </button>
        </div>
<!-------------------------------------------------END--------------------------------------------------->

    </div>

</main>

<script>
const form = document.getElementById("formulario");
const boton = document.getElementById("enviar");
const estado = document.getElementById("estado");
const areas = form.querySelectorAll("textarea");

areas.forEach(area => {
    area.addEventListener("input", () => {
        area.style.height = "auto";
        area.style.height = area.scrollHeight + "px";
    });
});

form.addEventListener("submit", async e => {
    e.preventDefault();

    boton.disabled = true;
    boton.textContent = "Sending...";
    estado.textContent = "";

    try {
        const respuesta = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: {
                Accept: "application/json"
            }
        });

        if (respuesta.ok) {
            form.reset();

            areas.forEach(area => {
                area.style.height = "";
            });

            estado.textContent = "Sent successfully";
            estado.className = "status ok";

        } else {
            estado.textContent = "Check fields";
            estado.className = "status error";
        }

    } catch {
        estado.textContent = "No network";
        estado.className = "status error";
    }

    boton.disabled = false;
    boton.textContent = "■";
});

document.getElementById("mostrarTextos").addEventListener("click", function() {
    const textos = document.getElementById("textos");

    if (textos.style.display === "block") {
        textos.style.display = "none";
        this.textContent = "\u00A0".repeat(5);
    } else {
        textos.style.display = "block";
        this.textContent = "\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0↑↑↑\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0";
    }
});

function copiarTexto(id, boton) {
    const texto = document.getElementById(id).textContent;

    navigator.clipboard.writeText(texto);

    boton.textContent = "✔";

    setTimeout(() => {
        boton.textContent = "\u00A0\u00A0\u00A0c\u00A0\u00A0\u00A0";
    }, 100);
}
</script>

</body>
</html>
