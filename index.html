<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>f</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #333333;
  color: #333333;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.container {
  background: #333333;
  padding: 25px;
  border-radius: 12px;
  width: 600px; /* más ancho el contenedor */
  box-shadow: 0 10px 25px #363636;
}
form {
  display: flex;
  flex-direction: column;
}
textarea, button {
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #2c2c2c;
  color: #f0f0f0;
  font-size: 16px;
  resize: vertical; /* permite alargar verticalmente */
  min-height: 80px; /* altura mínima */
}
/* placeholder gris */
textarea::placeholder {
  color: #aaaaaa;
}
button {
  background: #333333;
  color: white;
  border: none;
  cursor: pointer;
  margin-top: 20px;
  transition: background 0.3s;
  height: 50px;
  font-size: 18px;
}
button:hover {
  background: #12151b;
}
h1 {
  color: white;
  font-size: 48px;
  text-align: center;
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  margin: 0;
}
.texto-copiable {
  color: white;
  background: #2c2c2c;
  padding: 20px;
  margin-top: 20px;
  width: 100%;
  max-width: 1000px;
  box-sizing: border-box;
  border-radius: 8px;
  user-select: text;
  cursor: text;
  line-height: 1.5;
}
</style>

</head>
<body>
<div class="container" style="width: 1000px;">
  <form action="https://formspree.io/f/xlgwwqjw" method="POST">
    <textarea name="1-----------------------1" placeholder="1"></textarea>
    <textarea name="2-----------------------2" placeholder="2"></textarea>
    <textarea name="3-----------------------3" placeholder="3"></textarea>
    <textarea name="4-----------------------4" placeholder="4"></textarea>
    <textarea name="5-----------------------5" placeholder="5"></textarea>
    <button type="submit">.</button>
  </form>
</div>
<div class="texto-copiable">A continuación te enviaré imágenes que contienen texto. Quiero que transcribas y reescribas el contenido exactamente como aparece.<br><br>Tu respuesta debe contener únicamente el texto transcrito. No agregues comentarios, explicaciones, introducciones, conclusiones ni ninguna otra observación.</div>
</body>
</html>
